name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hugo:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Hugo
        run: |
          curl -fsSLo "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}" hugo
          sudo install "${RUNNER_TEMP}/hugo" /usr/local/bin/hugo

      - name: Build site
        run: hugo --gc --minify
